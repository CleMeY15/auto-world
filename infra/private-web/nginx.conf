worker_processes 2;
daemon off;
pid @RUNTIME@/nginx.pid;
error_log stderr emerg;
events { worker_connections 256; }
http {
    log_format counts '$status $request_time';
    access_log syslog:server=unix:/dev/log,tag=aw-private-edge counts;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    proxy_read_timeout 15s;
    client_body_temp_path @RUNTIME@/body;
    proxy_temp_path @RUNTIME@/proxy;
    fastcgi_temp_path @RUNTIME@/fastcgi;
    uwsgi_temp_path @RUNTIME@/uwsgi;
    scgi_temp_path @RUNTIME@/scgi;
    map "$request_method:$uri" $login_key {
        default "";
        "POST:/acces/connexion" $binary_remote_addr;
    }
    limit_req_zone $login_key zone=login:1m rate=8r/m;
    limit_req_status 429;
    upstream auth { server unix:/run/aw-private-auth/auth.sock; }
    upstream product { server unix:/run/aw-private-product/web.sock; }
    map "$request_method:$http_origin" $method_allowed {
        default 0;
        ~^(GET|HEAD): 1;
        "POST:https://autofind.tech" 1;
    }
    server {
        listen @V4_HTTP@ default_server;
        listen @V6_HTTP@ default_server;
        server_name _;
        if ($host != autofind.tech) { return 421; }
        return 308 https://autofind.tech$request_uri;
    }
    server {
        listen @V4_HTTPS@ ssl default_server;
        listen @V6_HTTPS@ ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen @V4_HTTPS@ ssl;
        listen @V6_HTTPS@ ssl;
        server_name autofind.tech;
        ssl_certificate /etc/aw-private-web/fullchain.pem;
        ssl_certificate_key @CREDENTIALS@/tls-key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != autofind.tech) { return 421; }
        if ($method_allowed = 0) { return 403; }
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header Referrer-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_pass_request_headers off;

        location = /session-check {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host autofind.tech;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_pass http://auth;
        }
        location ~ ^/acces/(connexion|deconnexion|(?:fragment|clear|launch)\.js|launch\.webp)$ {
            limit_req zone=login burst=15 nodelay;
            proxy_set_header Host autofind.tech;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header Referer $http_referer;
            proxy_set_header Content-Type $http_content_type;
            proxy_pass http://auth;
        }
        location @entry {
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host autofind.tech;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Original-URI $request_uri;
            rewrite ^ /entry break;
            proxy_pass http://auth;
        }
        location / {
            auth_request /session-check;
            error_page 401 = @entry;
            # Existing DTO proxy validates a loopback Host. Transport is the private socket.
            proxy_set_header Host 127.0.0.1:3130;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
            proxy_hide_header Set-Cookie;
            proxy_pass http://product;
        }
    }
}
