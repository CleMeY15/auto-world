{
  "name": "PostgreSQL package private read",
  "on": {"workflow_dispatch": {}},
  "permissions": {},
  "concurrency": {"group": "postgres-package-private-read", "cancel-in-progress": false},
  "jobs": {
    "verify": {
      "if": "${{ github.repository == 'CleMeY15/auto-world' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_number == 2 && github.run_attempt == 1 }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "permissions": {"contents": "read", "packages": "read"},
      "steps": [
        {
          "name": "Check out reviewed protected main",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up pinned Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {"node-version": "22.23.2", "cache": ""}
        },
        {
          "name": "Verify the exact existing bootstrap with read-only access",
          "id": "verify",
          "timeout-minutes": 12,
          "continue-on-error": true,
          "env": {"GITHUB_TOKEN": "${{ github.token }}"},
          "run": "node scripts/postgres-image/package-private-read.mjs --output \"${RUNNER_TEMP}/postgres-package-private-read\""
        },
        {
          "name": "Retain bounded public private-read receipt only",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "postgres-package-private-read-receipt",
            "path": "${{ runner.temp }}/postgres-package-private-read/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 14,
            "compression-level": 6
          }
        },
        {
          "name": "Enforce private-read result",
          "if": "${{ steps.verify.outcome != 'success' }}",
          "run": "exit 1"
        }
      ]
    }
  }
}
