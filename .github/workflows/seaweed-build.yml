{
  "name": "SeaweedFS source diagnostic",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "seaweed-source-diagnostic", "cancel-in-progress": false},
  "jobs": {
    "build": {
      "name": "Independent SeaweedFS build ${{ matrix.repeat }}",
      "if": "${{ github.repository == 'CleMeY15/auto-world' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "strategy": {"fail-fast": false, "matrix": {"repeat": [1, 2]}},
      "steps": [
        {"name": "Check out reviewed main source", "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"persist-credentials": false}},
        {"name": "Set up pinned Node.js", "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020", "with": {"node-version": "22.23.2", "cache": ""}},
        {
          "name": "Build and test exact corrected SeaweedFS source",
          "id": "build",
          "continue-on-error": true,
          "run": "node scripts/seaweed/build.mjs --repeat ${{ matrix.repeat }} --output \"${RUNNER_TEMP}/seaweed-build-${{ matrix.repeat }}\""
        },
        {
          "name": "Validate the complete public artifact directory",
          "id": "artifact_gate",
          "if": "${{ always() }}",
          "continue-on-error": true,
          "run": "node scripts/seaweed/artifact-gate.mjs --directory \"${RUNNER_TEMP}/seaweed-build-${{ matrix.repeat }}\" --output \"${RUNNER_TEMP}/seaweed-artifact-gate-${{ matrix.repeat }}.json\""
        },
        {
          "name": "Retain validated public source diagnostics",
          "if": "${{ always() && steps.artifact_gate.outcome == 'success' }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {"name": "seaweed-build-${{ matrix.repeat }}", "path": "${{ runner.temp }}/seaweed-build-${{ matrix.repeat }}", "if-no-files-found": "error", "retention-days": 14, "compression-level": 0, "include-hidden-files": true}
        },
        {
          "name": "Retain the bounded artifact-gate receipt",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {"name": "seaweed-artifact-gate-${{ matrix.repeat }}", "path": "${{ runner.temp }}/seaweed-artifact-gate-${{ matrix.repeat }}.json", "if-no-files-found": "error", "retention-days": 14, "compression-level": 6}
        },
        {"name": "Enforce build and artifact validation", "if": "${{ steps.build.outcome != 'success' || steps.artifact_gate.outcome != 'success' }}", "run": "exit 1"}
      ]
    },
    "compare": {
      "name": "Compare independent SeaweedFS builds",
      "needs": ["build"],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {"name": "Check out reviewed main source", "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"persist-credentials": false}},
        {"name": "Set up pinned Node.js", "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020", "with": {"node-version": "22.23.2", "cache": ""}},
        {"name": "Retrieve both validated build artifacts from this run", "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", "with": {"pattern": "seaweed-build-*", "path": "${{ runner.temp }}/seaweed-builds"}},
        {
          "name": "Compare actual binary and reconstruction material bytes",
          "id": "compare",
          "continue-on-error": true,
          "run": "node scripts/seaweed/compare.mjs --build-root \"${RUNNER_TEMP}/seaweed-builds\" --output \"${RUNNER_TEMP}/seaweed-comparison.json\""
        },
        {
          "name": "Retain the bounded comparison receipt",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {"name": "seaweed-comparison", "path": "${{ runner.temp }}/seaweed-comparison.json", "if-no-files-found": "error", "retention-days": 14, "compression-level": 6}
        },
        {"name": "Enforce comparison result", "if": "${{ steps.compare.outcome != 'success' }}", "run": "exit 1"}
      ]
    }
  }
}
