name: TASK-0005 Git material diagnostic V9

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/task005-git-materials-v9.yml
      - scripts/diagnostics/task005-git-materials-v9.mjs
      - tests/task005-git-materials-v9.test.mjs

permissions:
  contents: read

concurrency:
  group: task005-git-materials-v9
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.repository == 'CleMeY15/auto-world' && github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.draft == true && github.base_ref == 'main' && github.head_ref == 'codex/task-0005-git-materials-v9' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require the exact one-shot draft PR context
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'CleMeY15/auto-world'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "$GITHUB_EVENT_ACTION" = 'opened'
          test "$GITHUB_BASE_REF" = 'main'
          test "$GITHUB_HEAD_REF" = 'codex/task-0005-git-materials-v9'
          test "$GITHUB_RUN_NUMBER" = '1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_WORKFLOW_REF" = 'CleMeY15/auto-world/.github/workflows/task005-git-materials-v9.yml@refs/pull/'"${{ github.event.pull_request.number }}"'/merge'

      - name: Check out the reviewed diagnostic source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require the exact checked-out merge revision
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Set up pinned Node.js
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: ''

      - name: Run the focused actor contract tests before acquisition
        timeout-minutes: 2
        run: node --test tests/task005-git-materials-v9.test.mjs

      - name: Probe and diagnose exact Alpine materials
        id: diagnose
        timeout-minutes: 22
        continue-on-error: true
        run: node scripts/diagnostics/task005-git-materials-v9.mjs execute

      - name: Verify private material and container cleanup
        id: cleanup
        if: ${{ always() }}
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/diagnostics/task005-git-materials-v9.mjs cleanup

      - name: Retain only the bounded public receipt and manifest
        id: retain
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task005-git-materials-v9
          path: ${{ runner.temp }}/task005-git-materials-v9-public
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Dispose the local public copy
        id: dispose
        if: ${{ always() }}
        timeout-minutes: 1
        continue-on-error: true
        run: node scripts/diagnostics/task005-git-materials-v9.mjs dispose-public

      - name: Enforce diagnostic, retention and cleanup outcomes
        if: ${{ steps.diagnose.outcome != 'success' || steps.cleanup.outcome != 'success' || steps.retain.outcome != 'success' || steps.dispose.outcome != 'success' }}
        timeout-minutes: 1
        run: exit 1
