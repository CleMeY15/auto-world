{
  "name": "Scanner retention native Windows tests",
  "on": {
    "pull_request": {
      "paths": [
        ".github/workflows/scanner-retention-windows-tests.yml",
        "scripts/scanner/retention-*.mjs",
        "scripts/scanner/retention-private-copy-windows.*",
        "infra/scanner/retention.json",
        "tests/scanner-retention-*.test.mjs"
      ]
    },
    "push": {
      "branches": ["main"],
      "paths": [
        ".github/workflows/scanner-retention-windows-tests.yml",
        "scripts/scanner/retention-*.mjs",
        "scripts/scanner/retention-private-copy-windows.*",
        "infra/scanner/retention.json",
        "tests/scanner-retention-*.test.mjs"
      ]
    }
  },
  "permissions": {"contents": "read"},
  "concurrency": {
    "group": "scanner-retention-windows-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "ntfs-fixtures": {
      "name": "Exercise native scanner retention NTFS fixtures",
      "runs-on": "windows-2025",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Preserve authenticated source bytes on checkout",
          "shell": "pwsh",
          "run": "git config --global core.autocrlf false\nexit $LASTEXITCODE"
        },
        {
          "name": "Check out source without persistent credentials",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Provision repository Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {"node-version": "22.23.2", "package-manager-cache": false}
        },
        {
          "name": "Run native fixtures using the runner PowerShell host",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$env:AUTO_WORLD_TEST_PWSH = [Environment]::ProcessPath\nWrite-Output ('PowerShell ' + $PSVersionTable.PSVersion.ToString())\nnode -e \"if (process.platform !== 'win32' || process.versions.node !== '22.23.2') process.exit(1)\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nnode --test tests/scanner-retention-private-copy.test.mjs tests/scanner-retention-local-tools.test.mjs tests/scanner-retention-copy-preflight.test.mjs\nexit $LASTEXITCODE"
        }
      ]
    }
  }
}
