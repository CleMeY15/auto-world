name: AutoFindex marketplace PostgreSQL trial
on:
  push:
    branches: [spike/0148-postgres-trial]
    paths:
      - '.github/workflows/autofindex-marketplace-postgres-trial.yml'
      - 'connectors/leboncoin-spike/*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: connectors/leboncoin-spike
    env:
      PGDATABASE: autofindex_trial_ci_2000
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate parsers and importer
        run: python -m unittest -q jina_list_benchmark_test leboncoin_saved_rows_test test_leparking_page test_leparking_html test_marketplace_pages test_leparking_pg_trial test_collect_parking_trial
      - name: Create a PostgreSQL database on this runner
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --createdb "$(id -un)"
          createdb "$PGDATABASE"
      - name: Verify synthetic pages with the original reader
        run: |
          python parking_postgres_fixture.py "$RUNNER_TEMP/parking-fixture.json"
          python marketplace_pg_e2e.py --database "$PGDATABASE" --report "$RUNNER_TEMP/parking-fixture.json" --provenance fixture --oracle-sha256 f368df26b8f08022a22cd29348de58a4c44438933706c4ee1e0ec8fca171aad3 --out "$RUNNER_TEMP/receipts"
      - name: Verify historical UK listings in native units
        run: |
          python pg_historical_sample.py "$RUNNER_TEMP/uk.json"
          python marketplace_pg_e2e.py --database "$PGDATABASE" --report "$RUNNER_TEMP/uk.json" --provenance open-dataset --oracle-sha256 f20a66e162e65cc7a77cd3e6f36c894d432542cdfde2e51e8854f18a144b97c2 --out "$RUNNER_TEMP/receipts"
      - name: Save aggregate database receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: postgres-trial-receipts
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: warn
