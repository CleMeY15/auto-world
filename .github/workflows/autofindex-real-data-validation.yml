name: AutoFindex real historical car data validation
on:
  push:
    branches: [spike/0145-real-data-validation]
    paths: [.github/workflows/autofindex-real-data-validation.yml]
permissions:
  contents: read
concurrency:
  group: autofindex-real-data-validation
  cancel-in-progress: false
jobs:
  validate-real-records:
    if: >-
      github.repository == 'CleMeY15/auto-world' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/spike/0145-real-data-validation' &&
      github.event.before == 'ea066ebd8feb7815ea3f324c4f8037ece6b1cc3b' &&
      github.run_attempt == 1 &&
      github.run_number == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify committed plan
        run: test "$(git rev-parse HEAD~2)" = '5af7964344850f261c4ae97f76482602d921549e'
      - name: Validate offline regressions
        run: |
          python connectors/leboncoin-spike/jina_list_benchmark_test.py
          python -m py_compile connectors/leboncoin-spike/jina_real_data_validation.py
      - name: Download published historical dataset once and replay 500 records
        run: python connectors/leboncoin-spike/jina_real_data_validation.py --out "$RUNNER_TEMP/autofindex-real-data"
      - name: Publish aggregate evidence including errors and incomplete stages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: autofindex-real-data-validation
          path: ${{ runner.temp }}/autofindex-real-data/*.json
          retention-days: 7
          if-no-files-found: warn
