name: V1 prototype PostgreSQL store

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prototype-postgres.yml
      - services/ingestion/**
      - scripts/prototype-postgres/**
      - tests/prototype-postgres-*.test.mjs
      - connectors/_sdk/**
      - connectors/synthetic/**
      - packages/vehicle-schema/**
      - packages/source-registry/**
      - scripts/data-infra/**
      - infra/compose.json
      - infra/images.json
      - infra/postgres-init.sh
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/prototype-postgres.yml
      - services/ingestion/**
      - scripts/prototype-postgres/**
      - tests/prototype-postgres-*.test.mjs
      - connectors/_sdk/**
      - connectors/synthetic/**
      - packages/vehicle-schema/**
      - packages/source-registry/**
      - scripts/data-infra/**
      - infra/compose.json
      - infra/images.json
      - infra/postgres-init.sh
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: prototype-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Validate real PostgreSQL transactions and recovery
        run: pnpm prototype:test
      - name: Retain sanitized prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-postgres
          path: .local-data/prototype-postgres/*/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
