name: Observe one leboncoin native verification flow

on:
  push:
    branches: [spike/0137-leboncoin-autonomous]
    paths: [.github/workflows/leboncoin-native-flow.yml]

permissions:
  contents: read

concurrency:
  group: leboncoin-native-flow
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'CleMeY15/auto-world' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/spike/0137-leboncoin-autonomous' &&
      github.event.before == '61aec6f13794a20fc892d38553e943747ec8131e' &&
      github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the exact native flow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the published native flow plan parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '61aec6f13794a20fc892d38553e943747ec8131e'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the offline acquisition and native flow contracts
        run: node --test tests/leboncoin-spike.test.mjs

      - name: Install the matching Chromium runtime
        run: pnpm --filter @auto-world/web exec playwright install --with-deps chromium

      - name: Observe the native flow once and preserve the sealed evidence
        shell: bash
        run: |
          set -euo pipefail
          node connectors/leboncoin-spike/probe-native-flow.mjs --out "$RUNNER_TEMP/autofindex-leboncoin-native-flow"

      - name: Preserve only the public receipt and sealed envelope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leboncoin-native-flow
          path: |
            ${{ runner.temp }}/autofindex-leboncoin-native-flow/public-native-flow.json
            ${{ runner.temp }}/autofindex-leboncoin-native-flow/sealed-native-flow.json
          if-no-files-found: warn
          retention-days: 7
