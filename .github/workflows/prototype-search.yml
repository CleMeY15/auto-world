name: V1 prototype search projection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prototype-search.yml
      - services/search/**
      - services/api/**
      - services/ingestion/**
      - scripts/prototype-search/**
      - scripts/prototype-shared/**
      - scripts/prototype-postgres/**
      - tests/prototype-search-workflow.test.mjs
      - connectors/_sdk/**
      - connectors/synthetic/**
      - packages/demo-search-contract/**
      - packages/vehicle-schema/**
      - scripts/data-infra/**
      - infra/compose.json
      - infra/images.json
      - infra/postgres-init.sh
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/prototype-search.yml
      - services/search/**
      - services/api/**
      - services/ingestion/**
      - scripts/prototype-search/**
      - scripts/prototype-shared/**
      - scripts/prototype-postgres/**
      - tests/prototype-search-workflow.test.mjs
      - connectors/_sdk/**
      - connectors/synthetic/**
      - packages/demo-search-contract/**
      - packages/vehicle-schema/**
      - scripts/data-infra/**
      - infra/compose.json
      - infra/images.json
      - infra/postgres-init.sh
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: prototype-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up OpenSearch host capacity
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Build prototype search dependencies
        run: pnpm --filter @auto-world/ingestion build && pnpm --filter @auto-world/api build && pnpm --filter @auto-world/search build
      - name: Validate real PostgreSQL and OpenSearch projection
        run: pnpm prototype:search:test
      - name: Retain sanitized search evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-search
          path: .local-data/prototype-search/*/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
