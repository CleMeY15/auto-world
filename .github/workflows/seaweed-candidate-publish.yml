{
  "name": "SeaweedFS candidate publication",
  "on": {"workflow_dispatch": {}},
  "permissions": {},
  "concurrency": {"group": "seaweed-candidate-publication", "cancel-in-progress": false},
  "jobs": {
    "publish": {
      "if": "${{ github.repository == 'CleMeY15/auto-world' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "permissions": {"contents": "read", "actions": "read", "packages": "write"},
      "steps": [
        {
          "name": "Check out reviewed protected main",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up pinned Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {"node-version": "22.23.2", "cache": ""}
        },
        {
          "name": "Check temporary capacity and pinned Docker daemon",
          "timeout-minutes": 2,
          "run": "set -euo pipefail\navailable_kib=\"$(df -Pk \"$RUNNER_TEMP\" | awk 'NR == 2 { print $4 }')\"\ntest \"$available_kib\" -ge 12582912\ntest \"$(docker version --format '{{.Server.Version}}')\" = '28.0.4'"
        },
        {
          "name": "Publish one exact private unadmitted candidate",
          "id": "publish",
          "timeout-minutes": 165,
          "continue-on-error": true,
          "env": {"GH_TOKEN": "${{ github.token }}", "GITHUB_TOKEN": "${{ github.token }}"},
          "run": "node scripts/seaweed-image/candidate-publish.mjs --output \"${RUNNER_TEMP}/seaweed-candidate-publish\""
        },
        {
          "name": "Retain bounded public publication receipt only",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "seaweed-candidate-publish-receipt",
            "path": "${{ runner.temp }}/seaweed-candidate-publish/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 14,
            "compression-level": 6
          }
        },
        {
          "name": "Enforce publication result",
          "if": "${{ steps.publish.outcome != 'success' }}",
          "run": "exit 1"
        }
      ]
    }
  }
}
