name: Reader POC synthetic tests
on:
  pull_request:
    paths:
      - 'experiments/reader-poc/**'
      - '.github/workflows/reader-poc.yml'
  push:
    branches:
      - 'spike/reader-poc-20261124'
    paths:
      - 'experiments/reader-poc/**'
      - '.github/workflows/reader-poc.yml'
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Run isolated reader tests
        working-directory: experiments/reader-poc
        run: node --test test/*.test.mjs
      - name: Exercise synthetic change detection
        working-directory: experiments/reader-poc
        run: node src/demo.mjs

  document-containers:
    name: Document API container (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [core, web, renderer]
    steps:
      - uses: actions/checkout@v4
      - name: Validate container profile with synthetic documents
        working-directory: experiments/reader-poc/document-api
        env:
          SMOKE_MODE: ${{ matrix.mode }}
          READER_PUBLIC_DEMO: ${{ contains(github.event.pull_request.body, '<!-- reader-public-demo -->') && '1' || '0' }}
        run: bash ./test_containers.sh "$SMOKE_MODE"

  upstream-reference:
    name: Official Jina Reader offline conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Convert synthetic HTML with pinned Jina image
        working-directory: experiments/reader-poc/document-api
        run: bash ./test_containers.sh reference
