{
  "name": "Scanner retention publisher tool tests",
  "on": {
    "pull_request": {
      "paths": [
        ".github/workflows/scanner-retention-tools-tests.yml",
        ".github/workflows/scanner-retention-publish.yml",
        "scripts/scanner/retention-*.mjs",
        "scripts/scanner/retention-setup-buildx.sh",
        "infra/scanner/retention.json",
        "infra/scanner/retention-publisher-tools.json",
        "tests/scanner-retention-*.test.mjs"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/scanner-retention-tools-tests.yml",
        ".github/workflows/scanner-retention-publish.yml",
        "scripts/scanner/retention-*.mjs",
        "scripts/scanner/retention-setup-buildx.sh",
        "infra/scanner/retention.json",
        "infra/scanner/retention-publisher-tools.json",
        "tests/scanner-retention-*.test.mjs"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "scanner-retention-tools-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "buildx-discovery": {
      "name": "Verify publisher tools with a bounded local Docker build and copy",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out source without persistent credentials",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Provision exact managed Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "22.23.4",
            "package-manager-cache": false,
            "cache": ""
          }
        },
        {
          "name": "Test installer refusals, tool identities and probe boundaries",
          "shell": "bash",
          "run": "node --test tests/scanner-retention-setup-buildx.test.mjs tests/scanner-retention-tool-identity.test.mjs tests/scanner-retention-tools-probe.test.mjs"
        },
        {
          "name": "Install the authenticated qualified Buildx",
          "shell": "bash",
          "run": "bash scripts/scanner/retention-setup-buildx.sh"
        },
        {
          "name": "Build, copy and clean up a local scratch fixture without registry access",
          "shell": "bash",
          "run": "node scripts/scanner/retention-tools-probe.mjs"
        }
      ]
    }
  }
}
