name: Four-service data integration diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/data-integration-diagnostic.yml
      - infra/compose.json
      - infra/images.json
      - infra/migrations/**
      - infra/*.sh
      - scripts/data-infra/**
      - tests/data-infra-*.test.mjs
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/data-integration-diagnostic.yml
      - infra/compose.json
      - infra/images.json
      - infra/migrations/**
      - infra/*.sh
      - scripts/data-infra/**
      - tests/data-infra-*.test.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: data-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set disposable runner OpenSearch prerequisite
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Validate the real Compose lifecycle and data contracts
        run: pnpm infra:test
      - name: Retain sanitized validation records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-integration
          path: .local-data/integration/*/evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
