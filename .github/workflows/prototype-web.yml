name: V1 persistent web prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prototype-web.yml
      - apps/web/**
      - services/search/**
      - services/api/**
      - services/ingestion/**
      - scripts/prototype-web/**
      - scripts/prototype-application/**
      - scripts/prototype-shared/**
      - scripts/prototype-search/**
      - scripts/prototype-postgres/**
      - scripts/data-infra/**
      - connectors/_sdk/**
      - connectors/synthetic/**
      - packages/**
      - infra/compose.json
      - infra/images.json
      - infra/postgres-init.sh
      - tests/prototype-web-workflow.test.mjs
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/prototype-web.yml
      - apps/web/**
      - services/search/**
      - services/api/**
      - services/ingestion/**
      - scripts/prototype-web/**
      - scripts/prototype-application/**
      - scripts/prototype-shared/**
      - scripts/prototype-search/**
      - scripts/prototype-postgres/**
      - scripts/data-infra/**
      - connectors/_sdk/**
      - connectors/synthetic/**
      - packages/**
      - infra/compose.json
      - infra/images.json
      - infra/postgres-init.sh
      - tests/prototype-web-workflow.test.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: prototype-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up OpenSearch host capacity
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Build existing backend and web
        run: pnpm --filter @auto-world/search... build && pnpm --filter @auto-world/web... build
      - name: Validate the prototype composition contracts
        run: node --conditions=auto-world-prototype --conditions=auto-world-demo --test scripts/prototype-web/*.test.mjs
      - name: Install both existing browser engines
        timeout-minutes: 25
        run: pnpm --filter @auto-world/web exec playwright install --with-deps chromium webkit
      - name: Exercise persistent web, restart and failure recovery
        timeout-minutes: 25
        run: node --conditions=auto-world-prototype --conditions=auto-world-demo scripts/prototype-web/integration.mjs
      - name: Retain sanitized receipt and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-web
          path: |
            .local-data/prototype-web/*/result.json
            .local-data/prototype-web/*/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
