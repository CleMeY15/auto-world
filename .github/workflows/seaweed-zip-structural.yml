name: SeaweedFS authenticated ZIP structural diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seaweed-zip-structural
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require the first reviewed main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'CleMeY15/auto-world'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_NUMBER" = '1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_WORKFLOW_REF" = 'CleMeY15/auto-world/.github/workflows/seaweed-zip-structural.yml@refs/heads/main'

      - name: Check out reviewed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: ''

      - name: Check available temporary storage
        run: df -h "$RUNNER_TEMP"

      - name: Scan five owned ZIPs structurally
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/seaweed-image/scan-source-diagnostic.mjs scan

      - name: Remove diagnostic-owned empty directory
        if: ${{ always() }}
        run: node scripts/seaweed-image/scan-source-diagnostic.mjs cleanup
